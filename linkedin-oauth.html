<!DOCTYPE html>
<!-- Static OAuth redirect landing page. No Jekyll front matter on purpose so it
     is served verbatim. It only reads the URL query string and shows the value;
     it sends nothing anywhere. -->
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Authorization complete</title>
  <style>
    body { font-family: -apple-system, Segoe UI, Roboto, sans-serif; max-width: 640px;
           margin: 40px auto; padding: 0 20px; line-height: 1.5; color: #222; }
    h1 { font-size: 1.3rem; }
    .box { background: #f2f4f7; border: 1px solid #d0d5dd; border-radius: 8px;
           padding: 14px; word-break: break-all; font-family: monospace; font-size: 0.95rem; }
    button { margin-top: 12px; padding: 10px 16px; font-size: 1rem; border: 0;
             border-radius: 8px; background: #0a66c2; color: #fff; cursor: pointer; }
    .err { color: #b42318; }
    .muted { color: #667085; font-size: 0.9rem; }
  </style>
</head>
<body>
  <h1>Authorization complete ✅</h1>
  <p>Copy the code below and send it back in your chat.</p>
  <div id="out" class="box">Reading…</div>
  <button id="copy" style="display:none">Copy code</button>
  <p class="muted">This code is single-use and expires in ~30 minutes. This page
     only displays it — it is not sent or stored anywhere.</p>
  <script>
    var q = new URLSearchParams(window.location.search);
    var code = q.get("code");
    var err = q.get("error");
    var out = document.getElementById("out");
    var btn = document.getElementById("copy");
    if (code) {
      out.textContent = code;
      btn.style.display = "inline-block";
      btn.onclick = function () {
        navigator.clipboard.writeText(code).then(function () {
          btn.textContent = "Copied ✓";
        });
      };
    } else if (err) {
      out.className = "box err";
      out.textContent = "Error: " + err + " — " + (q.get("error_description") || "");
    } else {
      out.textContent = "No code found in the URL.";
    }
  </script>
</body>
</html>
